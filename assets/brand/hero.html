<!doctype html>
<!--
  Source of assets/brand/hero.png (README hero + GitHub social preview, 1280×640).
  The background is a genuine heatmap: a procedural road network is "ridden" by a few hundred
  synthetic rides (seeded, so the image is reproducible) and every road is coloured by how often
  it was used, the same idea as Ridestack's own heatmap.
  Render at 2×, e.g. with Playwright: viewport 1280×640, deviceScaleFactor 2, omitBackground.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ridestack hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .hero {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        border-radius: 28px;
        background: #0b1020;
        font-family: Inter, system-ui, sans-serif;
        color: #e6eaf2;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 640px;
      }
      .shade {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 46% 52% at 50% 50%,
            rgba(11, 16, 32, 0.94) 0%,
            rgba(11, 16, 32, 0.78) 45%,
            rgba(11, 16, 32, 0) 100%
          ),
          radial-gradient(
            ellipse 120% 120% at 50% 50%,
            rgba(11, 16, 32, 0) 55%,
            rgba(11, 16, 32, 0.85) 100%
          );
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .brand svg {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 10px 30px rgba(239, 68, 68, 0.25));
      }
      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .tagline {
        margin: 30px 0 0;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #22d3ee, #a3e635 35%, #facc15 60%, #f97316 82%, #ef4444);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        margin: 14px 0 0;
        max-width: 720px;
        font-size: 21px;
        line-height: 1.45;
        color: #a3adc2;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .chip {
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: #d5dbe7;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <canvas id="heat" width="2560" height="1280"></canvas>
      <div class="shade"></div>
      <div class="content">
        <div class="brand">
          <!-- assets/brand/ridestack-icon.svg -->
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1B2649" />
                <stop offset="1" stop-color="#080D1B" />
              </linearGradient>
              <linearGradient id="l1" x1="80" y1="0" x2="432" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#22D3EE" />
                <stop offset="1" stop-color="#38BDF8" />
              </linearGradient>
              <linearGradient id="l2" x1="80" y1="0" x2="432" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#A3E635" />
                <stop offset="1" stop-color="#FACC15" />
              </linearGradient>
              <linearGradient id="l3" x1="80" y1="0" x2="432" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#FB923C" />
                <stop offset="1" stop-color="#EF4444" />
              </linearGradient>
            </defs>
            <rect
              width="512"
              height="512"
              rx="116"
              fill="url(#bg)"
              stroke="rgba(255,255,255,0.08)"
              stroke-width="4"
            />
            <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40">
              <path d="M80 312 L256 413 L432 312" stroke="url(#l1)" />
              <path d="M80 254 L256 355 L432 254" stroke="url(#l2)" />
              <path d="M256 95 L432 196 L256 297 L80 196 Z" stroke="url(#l3)" fill="#0E1428" />
            </g>
            <path
              d="M181.2 233.9 C308.8 241.4 203.2 150.6 330.8 158.1"
              fill="none"
              stroke="#F8FAFC"
              stroke-width="16"
              stroke-linecap="round"
            />
          </svg>
          <h1>Ridestack</h1>
        </div>
        <p class="tagline">Every ride. One map.</p>
        <p class="sub">
          A self-hosted cycling archive: Garmin &amp; Hammerhead sync, automatic route grouping and
          your personal heatmap.
        </p>
        <div class="chips">
          <span class="chip">Garmin</span>
          <span class="chip">Hammerhead Karoo</span>
          <span class="chip">GPX / FIT</span>
          <span class="chip">Self-hosted</span>
        </div>
      </div>
    </div>
    <script>
      const W = 2560;
      const H = 1280;

      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = rng(7);

      // Road network: jittered grid of junctions, each linked to its nearest neighbours.
      const nodes = [];
      const STEP = 185;
      for (let y = -STEP; y <= H + STEP; y += STEP * 0.86) {
        for (let x = -STEP; x <= W + STEP; x += STEP) {
          nodes.push({
            x: x + (rand() - 0.5) * STEP * 0.8,
            y: y + (rand() - 0.5) * STEP * 0.8,
            edges: [],
          });
        }
      }
      const edges = [];
      const key = (a, b) => (a < b ? a + ':' + b : b + ':' + a);
      const seen = new Set();
      nodes.forEach((n, i) => {
        const near = nodes
          .map((m, j) => ({ j, d: Math.hypot(m.x - n.x, m.y - n.y) }))
          .filter((o) => o.j !== i)
          .sort((p, q) => p.d - q.d)
          .slice(0, 3 + (rand() < 0.35 ? 1 : 0));
        for (const { j } of near) {
          if (seen.has(key(i, j))) continue;
          seen.add(key(i, j));
          edges.push({
            a: i,
            b: j,
            count: 0,
            weight: 0.2 + 2.6 * rand() ** 3,
            pts: road(n, nodes[j]),
          });
          const e = edges.length - 1;
          n.edges.push(e);
          nodes[j].edges.push(e);
        }
      });

      // A road between two junctions: gentle bends plus small wiggles.
      function road(p, q) {
        const len = Math.hypot(q.x - p.x, q.y - p.y);
        const nx = -(q.y - p.y) / len;
        const ny = (q.x - p.x) / len;
        const bend = (rand() - 0.5) * len * 0.28;
        const w1 = (rand() - 0.5) * 9;
        const w2 = rand() * Math.PI * 2;
        const pts = [];
        const n = Math.max(8, Math.round(len / 8));
        for (let k = 0; k <= n; k++) {
          const t = k / n;
          const off =
            Math.sin(Math.PI * t) * bend +
            Math.sin(t * Math.PI * 5 + w2) * w1 * Math.sin(Math.PI * t);
          pts.push([p.x + (q.x - p.x) * t + nx * off, p.y + (q.y - p.y) * t + ny * off]);
        }
        return pts;
      }

      // Rides: loops starting at a few "home" junctions, momentum random walk (preferring the
      // popular roads), then home again.
      const nearestNode = (x, y) =>
        nodes.reduce(
          (best, n, i) =>
            Math.hypot(n.x - x, n.y - y) < Math.hypot(nodes[best].x - x, nodes[best].y - y)
              ? i
              : best,
          0
        );
      // [x, y, share of rides]: heat radiates from where people ride most.
      const homes = [
        [0.17, 0.64, 0.42],
        [0.84, 0.36, 0.4],
        [0.52, 0.06, 0.18],
      ].map(([x, y, share]) => ({ node: nearestNode(W * x, H * y), share }));
      const pickHome = () => {
        let u = rand();
        for (const h of homes) if ((u -= h.share) <= 0) return h.node;
        return homes[0].node;
      };

      const other = (e, i) => (edges[e].a === i ? edges[e].b : edges[e].a);
      for (let r = 0; r < 220; r++) {
        const home = pickHome();
        let cur = home;
        let prev = -1;
        let dir = rand() * Math.PI * 2;
        const steps = 2 + Math.floor(rand() ** 2 * 10);
        const path = [];
        for (let s = 0; s < steps * 2; s++) {
          const turning = s >= steps;
          const options = nodes[cur].edges.filter((e) => other(e, cur) !== prev);
          if (options.length === 0) break;
          const score = (e) => {
            const m = nodes[other(e, cur)];
            const ang = Math.atan2(m.y - nodes[cur].y, m.x - nodes[cur].x);
            const target = turning
              ? Math.atan2(nodes[home].y - nodes[cur].y, nodes[home].x - nodes[cur].x)
              : dir;
            return Math.cos(ang - target) + edges[e].weight * 0.9 + rand() * 0.8;
          };
          const e = options.reduce((b, o) => (score(o) > score(b) ? o : b));
          path.push(e);
          prev = cur;
          cur = other(e, cur);
          dir += (rand() - 0.5) * 0.9;
          if (turning && cur === home) break;
        }
        for (const e of new Set(path)) edges[e].count++;
      }

      // Render: unridden roads faintly, ridden ones coloured by frequency with a glow.
      const ctx = document.getElementById('heat').getContext('2d');
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const stroke = (pts) => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (const p of pts) ctx.lineTo(p[0], p[1]);
        ctx.stroke();
      };
      ctx.strokeStyle = 'rgba(120, 140, 190, 0.10)';
      ctx.lineWidth = 2;
      edges.forEach((e) => stroke(e.pts));

      const stops = [
        [0, [34, 211, 238]],
        [0.35, [163, 230, 53]],
        [0.6, [250, 204, 21]],
        [0.82, [249, 115, 22]],
        [1, [239, 68, 68]],
      ];
      const colour = (t) => {
        for (let k = 1; k < stops.length; k++) {
          if (t <= stops[k][0]) {
            const [t0, c0] = stops[k - 1];
            const [t1, c1] = stops[k];
            const f = (t - t0) / (t1 - t0);
            return c0.map((v, i) => Math.round(v + (c1[i] - v) * f));
          }
        }
        return stops[stops.length - 1][1];
      };
      const max = Math.max(...edges.map((e) => e.count));
      const ridden = edges.filter((e) => e.count > 0).sort((p, q) => p.count - q.count);
      for (const e of ridden) {
        const t = (e.count / max) ** 0.7;
        const [r, g, b] = colour(t);
        ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.9)`;
        ctx.shadowBlur = 6 + 30 * t;
        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.18 + 0.82 * t})`;
        ctx.lineWidth = 1.6 + 6.5 * t;
        stroke(e.pts);
      }
      ctx.shadowBlur = 0;
      for (const e of ridden) {
        const t = (e.count / max) ** 0.7;
        if (t < 0.55) continue;
        ctx.strokeStyle = `rgba(255, 244, 214, ${(t - 0.55) * 1.2})`;
        ctx.lineWidth = 1.5 + 2 * t;
        stroke(e.pts);
      }
    </script>
  </body>
</html>
